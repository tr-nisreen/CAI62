# Two containers work together in every student's codespace:
#   app = where you write and run C# (.NET 8 SDK)
#   db  = Microsoft SQL Server 2022 (Developer edition, free for learning)
#
# CLASSROOM ONLY: the password below is simple on purpose so students can
# remember it. Never use this password for a real/production database.

services:
  app:
    image: mcr.microsoft.com/devcontainers/dotnet:8.0
    volumes:
      - ../..:/workspaces:cached
    # Keep the container running so VS Code can connect to it.
    command: sleep infinity
    # Share the same network as SQL Server, so "localhost,1433"
    # reaches the database from the terminal, the API and the SQL extension.
    network_mode: service:db
    environment:
      ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=SchoolDb;User Id=sa;Password=Student@12345;TrustServerCertificate=True;Encrypt=False"
      ASPNETCORE_ENVIRONMENT: Development

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "Student@12345"   # CLASSROOM ONLY
    volumes:
      # Keeps the database when the codespace is stopped and started again.
      - mssql-data:/var/opt/mssql

volumes:
  mssql-data:
